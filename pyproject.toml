[project]
name = "rjnmr"
version = "0.1.0"
description = "Bayesian detection and estimation of damped sinusoids in NMR FIDs using Reversible Jump MCMC"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Denis V. Rubtsov" }]
requires-python = ">=3.11"
keywords = [
    "NMR",
    "spectroscopy",
    "Bayesian",
    "MCMC",
    "reversible jump",
    "metabolomics",
    "damped sinusoids",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
rjnmr = "rjnmr.cli:main"

[project.urls]
Homepage = "https://github.com/drubtsov/rjNMR"
Repository = "https://github.com/drubtsov/rjNMR"
Paper = "https://doi.org/10.1016/j.jmr.2007.08.008"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "matplotlib>=3.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "NPY", # numpy-specific
    "SIM",
    "RUF",
    "D",   # pydocstyle
    "PT",  # pytest style
]
ignore = [
    "D105", # magic methods
    "D401", # first line need not be imperative (properties, figures)
    "SIM300", # false positives with pytest.approx
    "D107", # __init__
    "RUF002", "RUF003", # greek letters in docstrings/comments are intentional
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PT011", "PT018"]
"examples/**" = ["D"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src/rjnmr"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --doctest-modules"
testpaths = ["tests", "src"]
markers = ["slow: long-running statistical tests (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
source = ["rjnmr"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
